name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main

pr: none

resources:
  repositories:
    - repository: templates
      type: github
      name: microsoft/vscode-engineering
      ref: main
      endpoint: Monaco

parameters:
  - name: publishPackage
    displayName: 🚀 Publish node-pty
    type: boolean
    default: false
  - name: releaseQuality
    displayName: Quality
    type: string
    values:
      - beta
      - stable
    default: beta

variables:
  - name: releaseQuality
    value: ${{ parameters.releaseQuality }}

extends:
  template: azure-pipelines/npm-package/pipeline.yml@templates
  parameters:
    npmPackages:
      - name: node-pty
        nodeVersion: '24.22.1'
        publishNpmVersion: '11.6.3'

        testPlatforms:
          - name: Linux
            nodeVersions:
              - '24.22.1'
            useSysroot: true

        buildSteps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download prebuilds'
            inputs:
              buildType: 'specific'
              project: 'Monaco'
              definition: '647'
              buildVersionToDownload: 'latestFromBranch'
              branchName: '$(Build.SourceBranch)'
              artifactName: 'prebuilds-$(Build.SourceVersion)'
              targetPath: 'prebuilds'
          - template: pipelines/npm-feed-auth.yml@self
          - pwsh: |
              Get-ChildItem -Path . -Recurse -Directory -Name "_manifest" | Remove-Item -Recurse -Force
            displayName: 'Delete _manifest folders'
          - bash: chmod +x prebuilds/darwin-*/spawn-helper
            displayName: 'Ensure spawn-helper is executable'
          - script: npm ci
            displayName: 'Install dependencies and build'
          # The following script leaves the version unchanged for
          # stable releases, but increments the version for beta releases.
          - script: node scripts/increment-version.js
            displayName: 'Increment version'
          - bash: |
              set -euo pipefail
              package_dir="$(mktemp -d)"
              npm pack --ignore-scripts --pack-destination "$package_dir" >/dev/null
              package_file=("$package_dir"/*.tgz)
              if ! tar -tvf "${package_file[0]}" | grep -Eq '^-rwxr-xr-x .*package/prebuilds/darwin-(arm64|x64)/spawn-helper$'; then
                echo 'The published package must contain executable macOS spawn-helper binaries.' >&2
                tar -tvf "${package_file[0]}" | grep 'spawn-helper' >&2 || true
                exit 1
              fi
            displayName: 'Verify packaged spawn-helper permissions'

        testSteps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download prebuilds'
            inputs:
              buildType: 'specific'
              project: 'Monaco'
              definition: '647'
              buildVersionToDownload: 'latestFromBranch'
              branchName: '$(Build.SourceBranch)'
              artifactName: 'prebuilds-$(Build.SourceVersion)'
              targetPath: 'prebuilds'
          - template: pipelines/npm-feed-auth.yml@self
          - bash: chmod +x prebuilds/darwin-*/spawn-helper
            displayName: 'Ensure spawn-helper is executable'
          - script: npm ci
            displayName: 'Install dependencies and build'
          - script: npm test
            displayName: 'Test'
          - script: npm run lint
            displayName: 'Lint'
          - bash: |
              set -euo pipefail
              package_dir="$(mktemp -d)"
              npm pack --ignore-scripts --pack-destination "$package_dir" >/dev/null
              package_file=("$package_dir"/*.tgz)
              if ! tar -tvf "${package_file[0]}" | grep -Eq '^-rwxr-xr-x .*package/prebuilds/darwin-(arm64|x64)/spawn-helper$'; then
                echo 'The published package must contain executable macOS spawn-helper binaries.' >&2
                tar -tvf "${package_file[0]}" | grep 'spawn-helper' >&2 || true
                exit 1
              fi
            displayName: 'Verify packaged spawn-helper permissions'

        publishPackage: ${{ parameters.publishPackage }}
        ${{ if eq(variables['releaseQuality'], 'stable') }}:
          tag: latest
          publishRequiresApproval: true
        ${{ else }}:
          tag: beta
          publishRequiresApproval: false

        apiScanExcludes: |
          package/third_party/conpty/**/win10-arm64/*.*
          package/prebuilds/win32-arm64/conpty/*.*
          package/prebuilds/win32-arm64/*.*
        apiScanSoftwareName: 'vscode-node-pty'
        apiScanSoftwareVersion: '1'
