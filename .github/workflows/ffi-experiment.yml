name: FFI PTY experiment

on:
  push:
    branches: [experiment/ffi-pty]
    paths:
      - "experiments/ffi-pty/**"
      - "test/experiments/ffi-pty/**"
      - ".github/workflows/ffi-experiment.yml"
  pull_request:
    paths:
      - "experiments/ffi-pty/**"
      - "test/experiments/ffi-pty/**"
      - ".github/workflows/ffi-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            name: macOS 15 ARM64
          - runner: macos-15-intel
            name: macOS 15 x64
          - runner: ubuntu-22.04
            name: Ubuntu 22.04 x64
          - runner: ubuntu-22.04-arm
            name: Ubuntu 22.04 ARM64
          - runner: windows-2022
            name: Windows Server 2022 x64
          - runner: windows-2025
            name: Windows Server 2025 x64
          - runner: windows-11-arm
            name: Windows 11 ARM64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
      - name: Test Windows without a helper executable
        if: runner.os == 'Windows'
        run: node --experimental-ffi --test --test-timeout=60000 test/experiments/ffi-pty/windows.test.mts
      - name: Build native Windows helper
        if: runner.os == 'Windows'
        run: node experiments/ffi-pty/build-windows-helper.mts
      - run: node --experimental-ffi --test --test-timeout=60000 test/experiments/ffi-pty/*.test.mts
      - name: Upload native Windows helper
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffi-helper-${{ matrix.runner }}-${{ runner.arch }}
          path: build/ffi-pty/*/helper.exe
          if-no-files-found: error
